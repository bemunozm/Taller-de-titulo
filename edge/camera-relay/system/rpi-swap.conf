# /etc/rpi/swap.conf.d/90-vigilia-relay.conf (lo instala install.sh si existe
# rpi-swap, el gestor de swap de Raspberry Pi OS Trixie)
#
# Swap solo en RAM comprimida (zram), sin archivo en la SD: `zram+file`, el
# default de Trixie, escribe páginas a /var/swap. Ver swap.conf(5).
# Se aplica al reiniciar. En Bookworm (dphys-swapfile) install.sh desactiva
# el swapfile en su lugar.
[Main]
Mechanism=zram

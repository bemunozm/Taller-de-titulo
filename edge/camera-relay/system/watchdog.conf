# /etc/systemd/system.conf.d/90-vigilia-relay-watchdog.conf (lo instala install.sh)
#
# Watchdog de hardware de la Pi 3B (bcm2835-wdt) manejado por systemd (PID 1):
# si el sistema se cuelga y PID 1 deja de alimentarlo, la Pi se reinicia sola.
# - RuntimeWatchdogSec=15s: el máximo del bcm2835 es ~15 s.
# - RebootWatchdogSec=2min: si un reinicio se cuelga, el watchdog lo fuerza.
# Se aplica con `systemctl daemon-reexec` (install.sh lo hace si cambió).
# Verificación: `wdctl` (Timeout 15 s) y `systemctl show -p RuntimeWatchdogUSec`.
[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=2min

# /etc/systemd/journald.conf.d/90-vigilia-relay.conf (lo instala install.sh)
#
# Journal persistente (sobrevive a los reinicios: hace falta para entender por
# qué se reinició la Pi), pero acotado para cuidar la SD:
# - SystemMaxUse=64M: tope en disco;
# - MaxRetentionSec=14day: los logs de MediaMTX traen la IP de cada lector
#   (dato personal, Ley 21.719): no se guardan más de dos semanas;
# - SyncIntervalSec=5m: menos escrituras a la SD (lo crítico se sincroniza igual).
[Journal]
Storage=persistent
SystemMaxUse=64M
RuntimeMaxUse=16M
MaxRetentionSec=14day
SyncIntervalSec=5m

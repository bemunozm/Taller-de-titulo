# CI de Vigilia (Fase 4 · P8.C, docs/modulos/hardening-pre-piloto.md, "Detalle de la P8").
#
# Bloqueantes: backend (typecheck, build, unit, migraciones contra Postgres 15
# y e2e), vigilia-hub (typecheck, test con umbral de cobertura, build),
# frontend (test y build), lpr (pytest con el set liviano requirements-ci.txt)
# y camera-relay (pytest en 3.11 y 3.13 con el contract test de MediaMTX,
# shellcheck y systemd-analyze security).
# No bloqueantes (pasos con continue-on-error, resumidos en el Summary del job):
# `lint:check` del backend, `lint` del frontend y `npm audit --audit-level=high`.
#
# Sin secretos: la contraseña del Postgres del service es de un contenedor
# efímero que solo vive durante el job. Para correr lo mismo en local:
# scripts/gate.sh (ver scripts/README.md).
name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/**']

# Un push nuevo a la misma rama/PR cancela la corrida anterior; en main no se
# cancela (cada commit de main queda verificado).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: vigilia_ci
          POSTGRES_PASSWORD: vigilia_ci
          POSTGRES_DB: vigilia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vigilia_ci -d vigilia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Los lee src/database/data-source.ts (CLI de migraciones). Sin
      # synchronize: el esquema lo crean SOLO las migraciones.
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: vigilia_ci
      DB_PASSWORD: vigilia_ci
      DB_NAME: vigilia_ci
      DB_SYNCHRONIZE: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        id: install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests unitarios
        run: npm test

      - name: Migraciones (BD vacía)
        run: npm run migration:run

      - name: Drift entre entidades y migraciones
        run: npm run migration:check

      # E2E de caja negra (P8.B, test/e2e/harness): el globalSetup toma la
      # conexión de los DB_* del job (vigilia_ci es superusuario: crea y borra
      # su BD `vigilia_e2e_*` desde la BD de mantenimiento `postgres`), corre
      # las migraciones, arranca la app compilada con un env de prueba y
      # secretos que genera el propio harness, y apunta OpenAI y SMTP a
      # servidores falsos locales. Sin secretos en el workflow.
      # `test:e2e:run` usa el `dist/` del paso Build (`test:e2e` compilaría de
      # nuevo). Alternativa a los DB_*:
      # E2E_DATABASE_URL=postgres://vigilia_ci:vigilia_ci@localhost:5432/postgres
      - name: Tests e2e
        env:
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/vigilia-e2e
        run: npm run test:e2e:run

      - name: Logs de los e2e (si fallan)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vigilia-e2e-logs
          path: ${{ runner.temp }}/vigilia-e2e
          if-no-files-found: ignore
          retention-days: 7

      # --- No bloqueantes -------------------------------------------------
      - name: Lint (no bloqueante)
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm run lint:check

      - name: npm audit (no bloqueante)
        id: audit
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Resumen no bloqueante
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### backend: chequeos no bloqueantes"
            echo "| chequeo | resultado |"
            echo "| --- | --- |"
            echo "| lint:check | ${{ steps.lint.outcome }} |"
            echo "| npm audit --audit-level=high | ${{ steps.audit.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  hub:
    name: vigilia-hub
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vigilia-hub
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: vigilia-hub/package-lock.json

      # `pigpio` es opcional: aquí no compila (no hay librería C de pigpio) y
      # npm sigue; el gpio-wrapper simula el GPIO.
      - name: Instalar dependencias
        id: install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Corre toda la suite y aplica el umbral de cobertura (jest.config.js).
      - name: Tests (con umbral de cobertura)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: npm audit (no bloqueante)
        id: audit
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Resumen no bloqueante
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### vigilia-hub: chequeos no bloqueantes"
            echo "| chequeo | resultado |"
            echo "| --- | --- |"
            echo "| npm audit --audit-level=high | ${{ steps.audit.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        id: install
        run: npm ci

      - name: Tests
        run: npm run test:run

      - name: Build
        run: npm run build

      # --- No bloqueantes -------------------------------------------------
      - name: Lint (no bloqueante)
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm run lint

      - name: npm audit (no bloqueante)
        id: audit
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Resumen no bloqueante
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### frontend: chequeos no bloqueantes"
            echo "| chequeo | resultado |"
            echo "| --- | --- |"
            echo "| lint | ${{ steps.lint.outcome }} |"
            echo "| npm audit --audit-level=high | ${{ steps.audit.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  lpr:
    name: lpr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: lpr/requirements-ci.txt

      # Set liviano (sin torch/ultralytics): ver el comentario en el archivo.
      - name: Instalar dependencias de test
        run: python -m pip install -r lpr/requirements-ci.txt

      # Desde la raíz del repo: tests/conftest.py agrega la raíz al sys.path.
      - name: Tests
        run: python -m pytest lpr/tests

  # Kit del relay de cámaras de la Raspberry Pi 3B (edge/camera-relay/README.md).
  # Python 3.11 = Raspberry Pi OS Bookworm; 3.13 = Trixie. El contract test
  # corre contra el binario real de MediaMTX v1.15.2 (linux_amd64), descargado
  # del release y verificado por SHA256 (el de arm64 lo fija install.sh).
  camera-relay:
    name: camera-relay (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      MEDIAMTX_VERSION: v1.15.2
      # checksums.sha256 del release v1.15.2 (= digest del asset en la API de GitHub).
      MEDIAMTX_SHA256_LINUX_AMD64: 8143486d886cc2d5c76f98d687cfb2ee6daf947fd45989c9322c0618057dcf5b
      # El contract test falla (no se salta) si falta el binario.
      VIGILIA_REQUIRE_CONTRACT: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: edge/camera-relay/requirements-ci.txt

      - name: Instalar dependencias de test
        run: python -m pip install -r edge/camera-relay/requirements-ci.txt

      # Solo el binario: el mediamtx.yml del tar trae todo abierto.
      - name: MediaMTX v1.15.2 (linux_amd64, SHA256 verificado)
        run: |
          dir="$RUNNER_TEMP/mediamtx"
          mkdir -p "$dir"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$dir/mediamtx.tar.gz" \
            "https://github.com/bluenviron/mediamtx/releases/download/${MEDIAMTX_VERSION}/mediamtx_${MEDIAMTX_VERSION}_linux_amd64.tar.gz"
          echo "${MEDIAMTX_SHA256_LINUX_AMD64}  $dir/mediamtx.tar.gz" | sha256sum -c -
          tar -xzf "$dir/mediamtx.tar.gz" -C "$dir" --no-same-owner mediamtx
          test "$("$dir/mediamtx" --version)" = "$MEDIAMTX_VERSION"
          echo "MEDIAMTX_BIN=$dir/mediamtx" >> "$GITHUB_ENV"

      - name: Tests (incluye el contract test con el binario real)
        run: python -m pytest edge/camera-relay/tests -p no:cacheprovider -rs

      - name: shellcheck y bash -n
        run: |
          shellcheck --version | head -n 2
          shellcheck -S style edge/camera-relay/install.sh edge/camera-relay/netwatch.sh
          bash -n edge/camera-relay/install.sh
          bash -n edge/camera-relay/netwatch.sh

      # Meta del plan: exposición < 2.0 (--threshold va en décimas).
      - name: systemd-analyze security de la unidad del relay
        run: systemd-analyze security --offline=true --threshold=20 edge/camera-relay/systemd/vigilia-relay.service

      # Oneshots de root (netwatch 2.1-2.3, follow-nvr 2.5-2.7 según el systemd):
      # necesitan root (ufw, ip, setpriv); el tope evita que se aflojen.
      - name: systemd-analyze security de netwatch y follow-nvr
        run: |
          systemd-analyze security --offline=true --threshold=30 edge/camera-relay/systemd/vigilia-relay-netwatch.service
          systemd-analyze security --offline=true --threshold=30 edge/camera-relay/systemd/vigilia-relay-follow-nvr.service
